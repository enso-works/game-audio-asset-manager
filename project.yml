name: GameAudioAssetManager
options:
  bundleIdPrefix: com.bavrk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  GameAudioAssetManager:
    type: application
    platform: macOS
    sources:
      - GameAudioAssetManager
    dependencies:
      - package: Sparkle
    info:
      path: GameAudioAssetManager/Info.plist
      properties:
        # Empty in normal builds; scripts/release.sh sets the feed so only releases self-update.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    scheme:
      testTargets:
        - GameAudioAssetManagerTests
    settings:
      base:
        PRODUCT_NAME: Game Audio Asset Manager
        PRODUCT_MODULE_NAME: GameAudioAssetManager
        PRODUCT_BUNDLE_IDENTIFIER: com.bavrk.gameaudioassetmanager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Game Audio Asset Manager
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # The release version. Tag releases as v<MARKETING_VERSION>; the build number is the commit count.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_KEY: v85BNiD/honcOddyIPyLMbAlAdpI/DVWAmFL3n5NpSI=
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: GameAudioAssetManager/Support/GameAudioAssetManager-Bridging-Header.h
  GameAudioAssetManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GameAudioAssetManagerTests
    dependencies:
      - target: GameAudioAssetManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bavrk.gameaudioassetmanager.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Game Audio Asset Manager.app/Contents/MacOS/Game Audio Asset Manager"
        BUNDLE_LOADER: "$(TEST_HOST)"
