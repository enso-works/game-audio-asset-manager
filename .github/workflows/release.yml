name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)"
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml"; exit 1; }
          grep -q "^## $VERSION$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: env.MACOS_CERT_P12 != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          xcrun notarytool store-credentials gaam-notary \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm -f "$KEY"
          echo "NOTARY_PROFILE=gaam-notary" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: scripts/release.sh

      - name: Write Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v') && env.SPARKLE_PRIVATE_KEY != ''
        run: |
          scripts/make-appcast.py "dist/GameAudioAssetManager-$VERSION-macos.zip" "$VERSION" "$(git rev-list --count HEAD)" > dist/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: GameAudioAssetManager-macos
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          scripts/make-appcast.py --notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ### Install
          - Download **GameAudioAssetManager-$VERSION-macos.dmg**, open it and drag the app to Applications, or
          - \`brew install --cask enso-works/tap/game-audio-asset-manager\`

          Requires macOS 14 or newer, plus \`brew install ffmpeg yt-dlp\` (the cask installs them). Updates arrive automatically.
          NOTES
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Game Audio Asset Manager $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" dist/* --clobber

      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v') && env.TAP_DEPLOY_KEY != '' && env.MACOS_CERT_P12 != ''
        run: |
          SHA="$(shasum -a 256 "dist/GameAudioAssetManager-$VERSION-macos.dmg" | cut -d' ' -f1)"
          KEY="$RUNNER_TEMP/tap_key"
          echo "$TAP_DEPLOY_KEY" > "$KEY" && chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:enso-works/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/game-audio-asset-manager.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "game-audio-asset-manager $VERSION" && git push
          rm -f "$KEY"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
