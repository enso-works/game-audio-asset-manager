name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: brew install xcodegen ffmpeg

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AudioPrepare.xcodeproj \
            -scheme AudioPrepare \
            -destination 'platform=macOS' \
            -derivedDataPath build-test \
            | grep -E "error:|warning: |Test Case .*(failed|skipped)|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"
